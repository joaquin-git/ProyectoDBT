version: 2

models:
  - name: slv_google_sheets__budget
    columns:
      - name: budget_id
        data_tests:
          - not_null
          - unique

      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('slv_sql_server_dbo__products')
                field: product_id

      - name: quantity_budgeted
        data_tests:
          - positive_values